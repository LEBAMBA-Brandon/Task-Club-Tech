name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_pgsql

      - name: Préparer Laravel et installer les dépendances
        working-directory: task-ctech-api
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          php artisan key:generate

      - name: Tester l’API
        working-directory: task-ctech-api
        run: php artisan test

      - name: Vérifier la construction Docker
        run: docker build -t ctech-api ./task-ctech-api

  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances Flutter
        working-directory: task_ctech
        run: flutter pub get

      - name: Analyser et tester
        working-directory: task_ctech
        run: |
          flutter analyze
          flutter test

      - name: Configurer la signature Android Release
        working-directory: task_ctech/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/task_ctech_release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=task_ctech_release.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          else
            echo "KEYSTORE_BASE64 non défini : signature debug utilisée."
          fi

      - name: Construire l’APK Android
        working-directory: task_ctech
        run: flutter build apk --release

      - name: Conserver l’APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: task_ctech/build/app/outputs/flutter-apk/app-release.apk

      - name: Construire l’APP Web
        working-directory: task_ctech
        run: flutter build web

      - name: Conserver l’APP Web comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: task_ctech/build/web

      - name: Publier la Release GitHub (APK pour Uptodown)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: task_ctech/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances Flutter
        working-directory: task_ctech
        run: flutter pub get

      - name: Analyser et tester
        working-directory: task_ctech
        run: |
          flutter analyze
          flutter test

      - name: Construire l’application Windows
        working-directory: task_ctech
        run: flutter build windows --release

      - name: Compresser le build Windows en archive ZIP
        working-directory: task_ctech
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\C-Tech-Tasks-Windows.zip" -Force

      - name: Conserver l’archive Windows comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: task_ctech/build/C-Tech-Tasks-Windows.zip

      - name: Publier la Release GitHub (ZIP Windows pour Uptodown)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: task_ctech/build/C-Tech-Tasks-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}